[project]
name = "fast-api-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kosuru Harsha", email = "lelaharsha@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "nodejs>=0.1.1",
    "psycopg2>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
fast-api-demo = "fast_api_demo:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
